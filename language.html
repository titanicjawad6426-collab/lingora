<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINGORA - Language Setup</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#39218a,#6652dc,#2996d8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 480px;
    padding: 30px 25px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.logo {
    font-size: 36px;
    font-weight: bold;
    text-align: center;
    color: #5136b5;
    letter-spacing: 1px;
}

.slogan {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
    font-size: 14px;
}

h2 {
    text-align: center;
    color: #39218a;
    font-size: 23px;
}

.description {
    text-align: center;
    color: #777;
    line-height: 1.8;
    margin-bottom: 22px;
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 9px;
    font-weight: bold;
    color: #444;
}

input, select {
    width: 100%;
    padding: 15px;
    border: 2px solid #e0ddf5;
    border-radius: 12px;
    font-size: 16px;
    background: #faf9ff;
    outline: none;
    font-family: inherit;
}

input:focus, select:focus {
    border-color: #6652dc;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg,#5136b5,#2996d8);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.back-button {
    background: #eeeafa;
    color: #5136b5;
    margin-top: 12px;
}

.section {
    display: none;
    animation: appear .4s ease;
}

.section.show {
    display: block;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 25px;
}

.language-icon {
    text-align: center;
    font-size: 45px;
    margin: 15px 0;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width:400px) {
    .container {
        padding: 25px 18px;
    }

    .logo {
        font-size: 30px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- الشعار -->

    <div class="logo">LINGORA 🌍</div>

    <div class="slogan">
        Learn. Speak. Explore.
    </div>


    <!-- المرحلة الأولى: اختيار اللغات -->

    <div id="languageSection" class="section show">

        <div class="language-icon">🌐</div>

        <h2 id="firstTitle">
            Welcome to LINGORA!
        </h2>

        <p class="description" id="firstDescription">
            Choose your native language and the language you want to learn.
        </p>


        <label id="nativeLabel">
            🗣️ Your native language
        </label>

        <select id="native">

            <option value="">
                -- Select your native language --
            </option>

            <option value="الإنجليزية">🇬🇧 English</option>
            <option value="العربية">🇲🇦 العربية</option>
            <option value="الفرنسية">🇫🇷 Français</option>
            <option value="الإسبانية">🇪🇸 Español</option>
            <option value="الألمانية">🇩🇪 Deutsch</option>
            <option value="الروسية">🇷🇺 Русский</option>

        </select>


        <label id="targetLabel">
            🎯 Language you want to learn
        </label>

        <select id="target">

            <option value="">
                -- Select a language --
            </option>

            <option value="الإنجليزية">🇬🇧 English</option>
            <option value="العربية">🇲🇦 العربية</option>
            <option value="الفرنسية">🇫🇷 Français</option>
            <option value="الإسبانية">🇪🇸 Español</option>
            <option value="الألمانية">🇩🇪 Deutsch</option>
            <option value="الروسية">🇷🇺 Русский</option>

        </select>


        <button type="button" onclick="goToProfile()" id="languageNext">
            Continue ➜
        </button>

    </div>


    <!-- المرحلة الثانية: إعداد المتعلم -->

    <div id="profileSection" class="section">

        <h2 id="profileTitle"></h2>

        <p class="description" id="profileDescription"></p>


        <label id="nameLabel"></label>

        <input type="text" id="name">


        <label id="ageLabel"></label>

        <input type="number" id="age" min="5" max="120">


        <label id="professionLabel"></label>

        <input type="text" id="profession">


        <label id="countryLabel"></label>

        <select id="country">

            <option value="morocco">🇲🇦</option>
            <option value="france">🇫🇷</option>
            <option value="algeria">🇩🇿</option>
            <option value="tunisia">🇹🇳</option>
            <option value="egypt">🇪🇬</option>
            <option value="saudi">🇸🇦</option>
            <option value="other">🌍</option>

        </select>


        <button type="button" onclick="startLearning()" id="startButton">
            Start Learning 🚀
        </button>


        <button type="button"
                class="back-button"
                onclick="showSection('languageSection')"
                id="profileBack">
            ➜ Back
        </button>

    </div>


    <div class="footer">
        LINGORA © 2026
    </div>

</div>

// =====================================
// عناصر الصفحة
// =====================================

const nativeSelect = document.getElementById("native");
const targetSelect = document.getElementById("target");

let currentNative = "الإنجليزية";


// =====================================
// ترجمة الصفحة
// =====================================

function changePageLanguage(language) {

    const t = translations[language];

    if (!t) return;

    currentNative = language;

    document.documentElement.lang = LANGUAGES[language].code;
    document.documentElement.dir = LANGUAGES[language].dir;

    document.title = "LINGORA - " + t.welcome;

    document.getElementById("firstTitle").textContent = t.welcome;

    document.getElementById("firstDescription").textContent =
        t.firstDescription;

    document.getElementById("nativeLabel").textContent =
        t.nativeLabel;

    document.getElementById("targetLabel").textContent =
        t.targetLabel;

    document.getElementById("languageNext").textContent =
        t.next;

    document.getElementById("profileTitle").textContent =
        t.profileTitle;

    document.getElementById("profileDescription").textContent =
        t.profileDescription;

    document.getElementById("nameLabel").textContent =
        t.name;

    document.getElementById("name").placeholder =
        t.namePlaceholder;

    document.getElementById("ageLabel").textContent =
        t.age;

    document.getElementById("age").placeholder =
        t.agePlaceholder;

    document.getElementById("professionLabel").textContent =
        t.profession;

    document.getElementById("profession").placeholder =
        t.professionPlaceholder;

    document.getElementById("countryLabel").textContent =
        t.country;

    document.getElementById("profileBack").textContent =
        t.back;

    document.getElementById("startButton").textContent =
        t.start;


    // ترجمة قائمة البلد

    const countrySelect = document.getElementById("country");

    Array.from(countrySelect.options).forEach((option,index) => {

        const flags = ["🇲🇦","🇫🇷","🇩🇿","🇹🇳","🇪🇬","🇸🇦","🌍"];

        option.textContent = flags[index] + " " + t.countries[index];

    });


    // ترجمة أسماء اللغات في القائمة

    const names = languageNames[language];

    [nativeSelect,targetSelect].forEach(select => {

        Array.from(select.options).forEach(option => {

            if(!option.value) {

                option.textContent = select === nativeSelect
                    ? t.chooseNative
                    : t.chooseTarget;

            } else {

                const flags = {
                    "العربية":"🇲🇦",
                    "الفرنسية":"🇫🇷",
                    "الإنجليزية":"🇬🇧",
                    "الإسبانية":"🇪🇸",
                    "الألمانية":"🇩🇪",
                    "الروسية":"🇷🇺"
                };

                option.textContent =
                    flags[option.value] + " " + names[option.value];

            }

        });

    });

}


// =====================================
// تحديث خيارات اللغات
// =====================================

function updateLanguageOptions() {

    const native = nativeSelect.value;

    Array.from(targetSelect.options).forEach(option => {

        option.disabled =
            option.value !== "" && option.value === native;

    });

    if(targetSelect.value === native) {

        targetSelect.value = "";

    }

}


// =====================================
// اختيار اللغة الأصلية
// =====================================

nativeSelect.addEventListener("change",function() {

    if(!this.value) return;

    changePageLanguage(this.value);

    updateLanguageOptions();

});


// =====================================
// تغيير لغة التعلم
// =====================================

targetSelect.addEventListener("change",function() {

    updateLanguageOptions();

});


// =====================================
// عرض الصفحات
// =====================================

function showSection(sectionId) {

    document.querySelectorAll(".section").forEach(section => {

        section.classList.remove("show");

    });

    document.getElementById(sectionId).classList.add("show");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


// =====================================
// الانتقال إلى إعداد المتعلم
// =====================================

function goToProfile() {

    const native = nativeSelect.value;
    const target = targetSelect.value;

    const t = translations[native || "الإنجليزية"];

    if(!native || !target) {

        alert(t.choose);
        return;

    }

    if(native === target) {

        alert(t.sameLanguage);
        return;

    }

    changePageLanguage(native);

    showSection("profileSection");

}


// =====================================
// بدء التعلم وحفظ البيانات
// =====================================

function startLearning() {

    const t = translations[currentNative];

    const name =
        document.getElementById("name").value.trim();

    const age =
        Number(document.getElementById("age").value);

    const profession =
        document.getElementById("profession").value.trim();

    const country =
        document.getElementById("country").value;

    const target =
        targetSelect.value;


    if(!name) {

        alert(t.enterName);

        document.getElementById("name").focus();

        return;

    }


    if(!Number.isInteger(age) || age < 5 || age > 120) {

        alert(t.invalidAge);

        document.getElementById("age").focus();

        return;

    }


    if(!target || target === currentNative) {

        alert(t.sameLanguage);

        return;

    }


    // بيانات المتعلم

    const learner = {

        name: name,

        age: age,

        profession: profession,

        country: country,

        nativeLanguage: currentNative,

        targetLanguage: target

    };


    // حفظ البيانات

    localStorage.setItem(
        "lingoraLearner",
        JSON.stringify(learner)
    );


    // حفظ لغة الواجهة

    localStorage.setItem(
        "lingoraNativeLanguage",
        currentNative
    );


    // حفظ لغة التعلم

    localStorage.setItem(
        "lingoraTargetLanguage",
        target
    );


    // الانتقال إلى لوحة التعلم

    window.location.href = "dashboard.html";

}


// =====================================
// تحميل الإعدادات السابقة
// =====================================

function loadSavedSettings() {

    const saved = localStorage.getItem("lingoraLearner");

    if(!saved) {

        // أول فتح: الإنجليزية هي اللغة الافتراضية

        changePageLanguage("الإنجليزية");

        return;

    }

    try {

        const learner = JSON.parse(saved);

        const native = learner.nativeLanguage;
        const target = learner.targetLanguage;

        if(LANGUAGES[native] && LANGUAGES[target]) {

            nativeSelect.value = native;
            targetSelect.value = target;

            changePageLanguage(native);

            updateLanguageOptions();

        } else {

            changePageLanguage("الإنجليزية");

        }

    } catch(error) {

        changePageLanguage("الإنجليزية");

    }

}
