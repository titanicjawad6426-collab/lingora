<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINGORA - إعداد المتعلم</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#39218a,#6652dc,#2996d8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 480px;
    padding: 30px 25px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.logo {
    font-size: 34px;
    font-weight: bold;
    text-align: center;
    color: #5136b5;
}

.slogan {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

h2 {
    text-align: center;
    color: #39218a;
    font-size: 23px;
}

.description {
    text-align: center;
    color: #777;
    line-height: 1.8;
    margin-bottom: 22px;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 8px;
    font-weight: bold;
    color: #444;
}

input, select {
    width: 100%;
    padding: 15px;
    border: 2px solid #e0ddf5;
    border-radius: 12px;
    font-size: 16px;
    background: #faf9ff;
    outline: none;
}

input:focus, select:focus {
    border-color: #6652dc;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg,#5136b5,#2996d8);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.back-button {
    background: #eeeafa;
    color: #5136b5;
    margin-top: 12px;
}

.section {
    display: none;
    animation: appear .4s ease;
}

.section.show {
    display: block;
}

.progress {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.progress span {
    width: 35px;
    height: 7px;
    border-radius: 10px;
    background: #e4e0f5;
}

.progress span.active {
    background: #6652dc;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 25px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width:400px) {
    .container {
        padding: 25px 18px;
    }

    .logo {
        font-size: 30px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">LINGORA 🌍</div>

    <div class="slogan">
        Learn. Speak. Explore.
    </div>

    <div class="progress">
        <span id="step1" class="active"></span>
        <span id="step2"></span>
        <span id="step3"></span>
    </div>


    <!-- المرحلة الأولى -->

    <div id="nativeSection" class="section show">

        <h2 id="firstTitle">
            مرحباً بك في LINGORA!
        </h2>

        <p class="description" id="firstDescription">
            اختر لغتك الأصلية لنقدم لك التطبيق باللغة التي تفهمها.
        </p>

        <label id="nativeLabel">
            🗣️ ما لغتك الأصلية؟
        </label>

        <select id="native">

            <option value="">
                -- اختر لغتك --
            </option>

            <option value="العربية">
                🇸🇦 العربية
            </option>

            <option value="الفرنسية">
                🇫🇷 Français
            </option>

            <option value="الإنجليزية">
                🇬🇧 English
            </option>

            <option value="الإسبانية">
                🇪🇸 Español
            </option>

        </select>

        <button type="button" onclick="goToTarget()" id="nativeNext">
            التالي ➜
        </button>

    </div>


    <!-- المرحلة الثانية -->

    <div id="targetSection" class="section">

        <h2 id="targetTitle"></h2>

        <p class="description" id="targetDescription"></p>

        <label id="targetLabel"></label>

        <select id="target">

            <option value="الفرنسية">🇫🇷 الفرنسية</option>
            <option value="الإنجليزية">🇬🇧 الإنجليزية</option>
            <option value="العربية">🇸🇦 العربية</option>
            <option value="الإسبانية">🇪🇸 الإسبانية</option>
            <option value="الألمانية">🇩🇪 الألمانية</option>
            <option value="الإيطالية">🇮🇹 الإيطالية</option>

        </select>

        <button type="button" onclick="goToProfile()" id="targetNext">
            التالي ➜
        </button>

        <button type="button" class="back-button"
                onclick="showSection('nativeSection',1)" id="targetBack">
            ➜ رجوع
        </button>

    </div>


    <!-- المرحلة الثالثة -->

    <div id="profileSection" class="section">

        <h2 id="profileTitle"></h2>

        <p class="description" id="profileDescription"></p>

        <label id="nameLabel"></label>

        <input type="text" id="name">

        <label id="ageLabel"></label>

        <input type="number" id="age" min="5" max="120">

        <label id="professionLabel"></label>

        <input type="text" id="profession">

        <label id="countryLabel"></label>

        <select id="country">

            <option value="المغرب">🇲🇦 المغرب</option>
            <option value="فرنسا">🇫🇷 فرنسا</option>
            <option value="الجزائر">🇩🇿 الجزائر</option>
            <option value="تونس">🇹🇳 تونس</option>
            <option value="مصر">🇪🇬 مصر</option>
            <option value="السعودية">🇸🇦 السعودية</option>
            <option value="بلد آخر">🌍 بلد آخر</option>

        </select>

        <button type="button" onclick="startLearning()" id="startButton">
            ابدأ التعلم 🚀
        </button>

        <button type="button" class="back-button"
                onclick="showSection('targetSection',2)" id="profileBack">
            ➜ رجوع
        </button>

    </div>


    <div class="footer">
        LINGORA © 2026
    </div>

</div>


<script>

// =====================================
// الترجمات
// =====================================

const translations = {

    "العربية": {

        dir: "rtl",
        lang: "ar",

        welcome: "مرحباً بك في LINGORA!",
        firstDescription: "اختر لغتك الأصلية لنقدم لك التطبيق باللغة التي تفهمها.",
        nativeLabel: "🗣️ ما لغتك الأصلية؟",

        targetTitle: "رائع! لنختر لغة جديدة",
        targetDescription: "اختر اللغة التي ترغب في تعلمها.",
        targetLabel: "🎯 اللغة التي تريد تعلمها؟",

        profileTitle: "لنبدأ رحلتنا التعليمية!",
        profileDescription: "أخبرنا قليلاً عن نفسك لنخصص تجربة التعلم المناسبة لك.",

        name: "👤 الاسم الكامل",
        namePlaceholder: "أدخل اسمك",

        age: "🎂 السن",
        agePlaceholder: "أدخل عمرك",

        profession: "💼 المهنة (اختياري)",
        professionPlaceholder: "مثلاً: تلميذ، طالب، أستاذ...",

        country: "🌍 البلد",

        next: "التالي ➜",
        back: "➜ رجوع",
        start: "ابدأ التعلم 🚀",

        choose: "يرجى اختيار اللغة.",
        enterName: "يرجى إدخال اسمك.",
        invalidAge: "يرجى إدخال سن صحيح بين 5 و120 سنة.",
        sameLanguage: "يرجى اختيار لغة مختلفة عن لغتك الأصلية."

    },


    "الفرنسية": {

        dir: "ltr",
        lang: "fr",

        welcome: "Bienvenue sur LINGORA !",
        firstDescription: "Choisissez votre langue maternelle pour utiliser l'application dans une langue que vous comprenez.",
        nativeLabel: "🗣️ Quelle est votre langue maternelle ?",

        targetTitle: "Super ! Choisissons une nouvelle langue",
        targetDescription: "Choisissez la langue que vous souhaitez apprendre.",
        targetLabel: "🎯 Quelle langue voulez-vous apprendre ?",

        profileTitle: "Commençons votre aventure !",
        profileDescription: "Parlez-nous un peu de vous pour personnaliser votre expérience d'apprentissage.",

        name: "👤 Nom complet",
        namePlaceholder: "Entrez votre nom",

        age: "🎂 Âge",
        agePlaceholder: "Entrez votre âge",

        profession: "💼 Profession (facultatif)",
        professionPlaceholder: "Exemple : élève, étudiant, professeur...",

        country: "🌍 Pays",

        next: "Suivant ➜",
        back: "➜ Retour",
        start: "Commencer 🚀",

        choose: "Veuillez choisir une langue.",
        enterName: "Veuillez entrer votre nom.",
        invalidAge: "Veuillez entrer un âge valide entre 5 et 120 ans.",
        sameLanguage: "Veuillez choisir une langue différente de votre langue maternelle."

    },


    "الإنجليزية": {

        dir: "ltr",
        lang: "en",

        welcome: "Welcome to LINGORA!",
        firstDescription: "Choose your native language so you can use the app in a language you understand.",
        nativeLabel: "🗣️ What is your native language?",

        targetTitle: "Great! Let's choose a new language",
        targetDescription: "Choose the language you want to learn.",
        targetLabel: "🎯 Which language do you want to learn?",

        profileTitle: "Let's start your learning journey!",
        profileDescription: "Tell us a little about yourself so we can personalize your learning experience.",

        name: "👤 Full name",
        namePlaceholder: "Enter your name",

        age: "🎂 Age",
        agePlaceholder: "Enter your age",

        profession: "💼 Profession (optional)",
        professionPlaceholder: "Example: pupil, student, teacher...",

        country: "🌍 Country",

        next: "Next ➜",
        back: "➜ Back",
        start: "Start learning 🚀",

        choose: "Please choose a language.",
        enterName: "Please enter your name.",
        invalidAge: "Please enter a valid age between 5 and 120.",
        sameLanguage: "Please choose a language different from your native language."

    },


    "الإسبانية": {

        dir: "ltr",
        lang: "es",

        welcome: "¡Bienvenido a LINGORA!",
        firstDescription: "Elige tu idioma nativo para utilizar la aplicación en un idioma que entiendas.",
        nativeLabel: "🗣️ ¿Cuál es tu idioma nativo?",

        targetTitle: "¡Genial! Elijamos un nuevo idioma",
        targetDescription: "Elige el idioma que deseas aprender.",
        targetLabel: "🎯 ¿Qué idioma quieres aprender?",

        profileTitle: "¡Comencemos tu viaje de aprendizaje!",
        profileDescription: "Cuéntanos un poco sobre ti para personalizar tu experiencia de aprendizaje.",

        name: "👤 Nombre completo",
        namePlaceholder: "Escribe tu nombre",

        age: "🎂 Edad",
        agePlaceholder: "Escribe tu edad",

        profession: "💼 Profesión (opcional)",
        professionPlaceholder: "Ejemplo: alumno, estudiante, profesor...",

        country: "🌍 País",

        next: "Siguiente ➜",
        back: "➜ Volver",
        start: "Comenzar a aprender 🚀",

        choose: "Por favor, elige un idioma.",
        enterName: "Por favor, escribe tu nombre.",
        invalidAge: "Introduce una edad válida entre 5 y 120 años.",
        sameLanguage: "Elige un idioma diferente de tu idioma nativo."

    }

};


// =====================================
// ترجمة البلدان
// =====================================

const countryTranslations = {

    "العربية": [
        "المغرب","فرنسا","الجزائر","تونس","مصر","السعودية","بلد آخر"
    ],

    "الفرنسية": [
        "Maroc","France","Algérie","Tunisie","Égypte","Arabie saoudite","Autre pays"
    ],

    "الإنجليزية": [
        "Morocco","France","Algeria","Tunisia","Egypt","Saudi Arabia","Other country"
    ],

    "الإسبانية": [
        "Marruecos","Francia","Argelia","Túnez","Egipto","Arabia Saudita","Otro país"
    ]

};


// =====================================
// ترجمة خيارات اللغات
// =====================================

const languageOptions = {

    "العربية": {
        "الفرنسية": "🇫🇷 الفرنسية",
        "الإنجليزية": "🇬🇧 الإنجليزية",
        "العربية": "🇸🇦 العربية",
        "الإسبانية": "🇪🇸 الإسبانية",
        "الألمانية": "🇩🇪 الألمانية",
        "الإيطالية": "🇮🇹 الإيطالية"
    },

    "الفرنسية": {
        "الفرنسية": "🇫🇷 Français",
        "الإنجليزية": "🇬🇧 Anglais",
        "العربية": "🇸🇦 Arabe",
        "الإسبانية": "🇪🇸 Espagnol",
        "الألمانية": "🇩🇪 Allemand",
        "الإيطالية": "🇮🇹 Italien"
    },

    "الإنجليزية": {
        "الفرنسية": "🇫🇷 French",
        "الإنجليزية": "🇬🇧 English",
        "العربية": "🇸🇦 Arabic",
        "الإسبانية": "🇪🇸 Spanish",
        "الألمانية": "🇩🇪 German",
        "الإيطالية": "🇮🇹 Italian"
    },

    "الإسبانية": {
        "الفرنسية": "🇫🇷 Francés",
        "الإنجليزية": "🇬🇧 Inglés",
        "العربية": "🇸🇦 Árabe",
        "الإسبانية": "🇪🇸 Español",
        "الألمانية": "🇩🇪 Alemán",
        "الإيطالية": "🇮🇹 Italiano"
    }

};


// =====================================
// عناصر الصفحة
// =====================================

const nativeSelect = document.getElementById("native");
const targetSelect = document.getElementById("target");

let currentNative = "";


// =====================================
// تغيير لغة الصفحة
// =====================================

function changePageLanguage(language) {

    const t = translations[language];

    document.documentElement.lang = t.lang;
    document.documentElement.dir = t.dir;

    document.getElementById("firstTitle").textContent = t.welcome;
    document.getElementById("firstDescription").textContent = t.firstDescription;
    document.getElementById("nativeLabel").textContent = t.nativeLabel;

    document.getElementById("targetTitle").textContent = t.targetTitle;
    document.getElementById("targetDescription").textContent = t.targetDescription;
    document.getElementById("targetLabel").textContent = t.targetLabel;

    document.getElementById("profileTitle").textContent = t.profileTitle;
    document.getElementById("profileDescription").textContent = t.profileDescription;

    document.getElementById("nameLabel").textContent = t.name;
    document.getElementById("name").placeholder = t.namePlaceholder;

    document.getElementById("ageLabel").textContent = t.age;
    document.getElementById("age").placeholder = t.agePlaceholder;

    document.getElementById("professionLabel").textContent = t.profession;
    document.getElementById("profession").placeholder = t.professionPlaceholder;

    document.getElementById("countryLabel").textContent = t.country;

    document.getElementById("nativeNext").textContent = t.next;
    document.getElementById("targetNext").textContent = t.next;

    document.getElementById("targetBack").textContent = t.back;
    document.getElementById("profileBack").textContent = t.back;

    document.getElementById("startButton").textContent = t.start;


    // ترجمة البلدان

    const countries = countryTranslations[language];

    const countrySelect = document.getElementById("country");

    countries.forEach((country,index) => {

        const flags = ["🇲🇦","🇫🇷","🇩🇿","🇹🇳","🇪🇬","🇸🇦","🌍"];

        countrySelect.options[index].text =
            flags[index] + " " + country;

    });


    // ترجمة لغات التعلم

    const options = languageOptions[language];

    Array.from(targetSelect.options).forEach(option => {

        option.textContent = options[option.value];

    });

}


// =====================================
// عرض المرحلة المطلوبة
// =====================================

function showSection(sectionId,step) {

    document.querySelectorAll(".section").forEach(section => {

        section.classList.remove("show");

    });

    document.getElementById(sectionId).classList.add("show");


    // تحديث مؤشر التقدم

    for(let i=1;i<=3;i++) {

        document.getElementById("step"+i)
            .classList.toggle("active",i<=step);

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


// =====================================
// اختيار اللغة الأم
// =====================================

nativeSelect.addEventListener("change",function() {

    const selected = this.value;

    if(!selected) return;

    currentNative = selected;

    changePageLanguage(selected);


    // منع اختيار اللغة الأصلية كلغة تعلم

    Array.from(targetSelect.options).forEach(option => {

        option.disabled = option.value === currentNative;

    });


    // اختيار أول لغة متاحة

    const firstAvailable = Array.from(targetSelect.options)
        .find(option => !option.disabled);

    if(firstAvailable) {

        targetSelect.value = firstAvailable.value;

    }

});


// =====================================
// زر التالي من المرحلة الأولى
// =====================================

function goToTarget() {

    const selected = nativeSelect.value;

    if(!selected) {

        alert("يرجى اختيار لغتك الأصلية أولاً.");
        return;

    }

    currentNative = selected;

    changePageLanguage(selected);

    showSection("targetSection",2);

}


// =====================================
// زر التالي من المرحلة الثانية
// =====================================

function goToProfile() {

    const target = targetSelect.value;

    const t = translations[currentNative];

    if(!target || target === currentNative) {

        alert(t.sameLanguage);
        return;

    }

    showSection("profileSection",3);

}


// =====================================
// بدء التعلم وحفظ المعلومات
// =====================================

function startLearning() {

    const t = translations[currentNative];

    const name = document.getElementById("name").value.trim();

    const age = Number(document.getElementById("age").value);

    const profession = document.getElementById("profession").value.trim();

    const country = document.getElementById("country").value;

    const target = targetSelect.value;


    if(!name) {

        alert(t.enterName);

        document.getElementById("name").focus();

        return;

    }


    if(!Number.isInteger(age) || age < 5 || age > 120) {

        alert(t.invalidAge);

        document.getElementById("age").focus();

        return;

    }


    if(!target || target === currentNative) {

        alert(t.sameLanguage);

        return;

    }


    const learner = {

        name:name,

        age:age,

        profession:profession,

        country:country,

        nativeLanguage:currentNative,

        targetLanguage:target

    };


    // حفظ معلومات المتعلم

    localStorage.setItem(
        "lingoraLearner",
        JSON.stringify(learner)
    );


    // الانتقال إلى لوحة التعلم

    window.location.href = "dashboard.html";

}

</script>

</body>
</html>
