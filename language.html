<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINGORA - إعداد المتعلم</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#39218a,#6652dc,#2996d8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 480px;
    padding: 30px 25px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.logo {
    font-size: 34px;
    font-weight: bold;
    text-align: center;
    color: #5136b5;
}

.slogan {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

h2 {
    text-align: center;
    color: #39218a;
    font-size: 23px;
}

.description {
    text-align: center;
    color: #777;
    line-height: 1.7;
    margin-bottom: 22px;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 8px;
    font-weight: bold;
    color: #444;
}

input, select {
    width: 100%;
    padding: 14px;
    border: 2px solid #e0ddf5;
    border-radius: 12px;
    font-size: 16px;
    background: #faf9ff;
    outline: none;
}

input:focus, select:focus {
    border-color: #6652dc;
}

button {
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg,#5136b5,#2996d8);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.section {
    display: none;
    animation: appear .4s ease;
}

.section.show {
    display: block;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 22px;
}

.required {
    color: #e05252;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">LINGORA 🌍</div>

    <div class="slogan">
        Learn. Speak. Explore.
    </div>

    <!-- المرحلة الأولى: اختيار اللغة الأصلية -->

    <div id="nativeSection" class="section show">

        <h2 id="firstTitle">مرحباً بك!</h2>

        <p class="description" id="firstDescription">
            اختر لغتك الأصلية لنقدم لك التطبيق باللغة التي تفهمها.
        </p>

        <label id="nativeLabel">
            🗣️ ما لغتك الأصلية؟
        </label>

        <select id="native">
            <option value="">-- اختر لغتك --</option>
            <option value="العربية">العربية</option>
            <option value="الفرنسية">Français</option>
            <option value="الإنجليزية">English</option>
            <option value="الأمازيغية">Tamaziɣt</option>
            <option value="الإسبانية">Español</option>
        </select>

    </div>


    <!-- المرحلة الثانية: اختيار لغة التعلم -->

    <div id="targetSection" class="section">

        <h2 id="targetTitle"></h2>

        <p class="description" id="targetDescription"></p>

        <label id="targetLabel"></label>

        <select id="target">
            <option value="الفرنسية">🇫🇷 الفرنسية</option>
            <option value="الإنجليزية">🇬🇧 الإنجليزية</option>
            <option value="العربية">🇸🇦 العربية</option>
            <option value="الإسبانية">🇪🇸 الإسبانية</option>
            <option value="الألمانية">🇩🇪 الألمانية</option>
            <option value="الإيطالية">🇮🇹 الإيطالية</option>
        </select>

    </div>


    <!-- المرحلة الثالثة: معلومات المتعلم -->

    <div id="profileSection" class="section">

        <h2 id="profileTitle"></h2>

        <p class="description" id="profileDescription"></p>

        <label id="nameLabel"></label>
        <input type="text" id="name">

        <label id="ageLabel"></label>
        <input type="number" id="age" min="5" max="120">

        <label id="professionLabel"></label>
        <input type="text" id="profession">

        <label id="countryLabel"></label>

        <select id="country">
            <option value="المغرب">🇲🇦 المغرب</option>
            <option value="فرنسا">🇫🇷 فرنسا</option>
            <option value="الجزائر">🇩🇿 الجزائر</option>
            <option value="تونس">🇹🇳 تونس</option>
            <option value="مصر">🇪🇬 مصر</option>
            <option value="السعودية">🇸🇦 السعودية</option>
            <option value="بلد آخر">🌍 بلد آخر</option>
        </select>

        <button onclick="startLearning()" id="startButton">
            ابدأ التعلم 🚀
        </button>

    </div>


    <div class="footer">
        LINGORA © 2026
    </div>

</div>

// =====================================
// ترجمة أسماء البلدان
// =====================================

const countryTranslations = {

    "العربية": [
        "المغرب",
        "فرنسا",
        "الجزائر",
        "تونس",
        "مصر",
        "السعودية",
        "بلد آخر"
    ],

        "Maroc",

    ],

    ],

    "الأمازيغية": [
        "Lmɣrib",
        "Fransa",
        "Dzayer",

    ],

// =====================================
// ترجمة خيارات اللغات
// =====================================

const languageOptions = {

    "العربية": {
        "الفرنسية": "🇫🇷 الفرنسية",
        "الإنجليزية": "🇬🇧 الإنجليزية",
        "العربية": "🇸🇦 العربية",
        "الإسبانية": "🇪🇸 الإسبانية",
        "الألمانية": "🇩🇪 الألمانية",
        "الإيطالية": "🇮🇹 الإيطالية"
    },

    "الفرنسية": {
        "الفرنسية": "🇫🇷 Français",
        "الإنجليزية": "🇬🇧 Anglais",
        "العربية": "🇸🇦 Arabe",
        "الإسبانية": "🇪🇸 Espagnol",
        "الألمانية": "🇩🇪 Allemand",
        "الإيطالية": "🇮🇹 Italien"
    },

    "الإنجليزية": {
        "الفرنسية": "🇫🇷 French",
        "الإنجليزية": "🇬🇧 English",

    },

    "الأمازيغية": {

        "الإسبانية": "🇪🇸 Tasbanyulit",

    },

        "الإسبانية": "🇪🇸 Español",

        "الإيطالية": "🇮🇹 Italiano"
    }

};


// =====================================
// عناصر الصفحة
// =====================================

const nativeSelect = document.getElementById("native");
const targetSelect = document.getElementById("target");

let currentNative = "";


// =====================================
// تغيير لغة الصفحة
// =====================================

function changePageLanguage(language) {

    const t = translations[language];

    document.documentElement.lang = t.lang;
    document.documentElement.dir = t.dir;

    document.getElementById("firstTitle").textContent = t.welcome;
    document.getElementById("firstDescription").textContent = t.firstDescription;
    document.getElementById("nativeLabel").textContent = t.nativeLabel;

    document.getElementById("targetTitle").textContent = t.targetTitle;
    document.getElementById("targetDescription").textContent = t.targetDescription;
    document.getElementById("targetLabel").textContent = t.targetLabel;

    document.getElementById("profileTitle").textContent = t.profileTitle;
    document.getElementById("profileDescription").textContent = t.profileDescription;

    document.getElementById("nameLabel").textContent = t.name;
    document.getElementById("name").placeholder = t.namePlaceholder;

    document.getElementById("ageLabel").textContent = t.age;
    document.getElementById("age").placeholder = t.agePlaceholder;

    document.getElementById("professionLabel").textContent = t.profession;
    document.getElementById("profession").placeholder = t.professionPlaceholder;

    document.getElementById("countryLabel").textContent = t.country;

    document.getElementById("startButton").textContent = t.start;

    // ترجمة أسماء البلدان

    const countries = countryTranslations[language];
    const countrySelect = document.getElementById("country");

    countrySelect.options[0].text = "🇲🇦 " + countries[0];
    countrySelect.options[1].text = "🇫🇷 " + countries[1];
    countrySelect.options[2].text = "🇩🇿 " + countries[2];
    countrySelect.options[3].text = "🇹🇳 " + countries[3];
    countrySelect.options[4].text = "🇪🇬 " + countries[4];
    countrySelect.options[5].text = "🇸🇦 " + countries[5];
    countrySelect.options[6].text = "🌍 " + countries[6];

    // ترجمة خيارات لغة التعلم

    const options = languageOptions[language];

    Array.from(targetSelect.options).forEach(option => {
        option.textContent = options[option.value];
    });

}


// =====================================
// عند اختيار اللغة الأصلية
// =====================================

nativeSelect.addEventListener("change", function() {

    const selected = this.value;

    if (!selected) {
        return;
    }

    currentNative = selected;

    changePageLanguage(selected);

    // إظهار اختيار لغة التعلم

    document.getElementById("targetSection").classList.add("show");

    // إخفاء معلومات المتعلم حتى اختيار لغة التعلم

    document.getElementById("profileSection").classList.remove("show");

    // منع اختيار اللغة الأصلية كلغة تعلم

    Array.from(targetSelect.options).forEach(option => {

        option.disabled = option.value === currentNative;

    });

    // اختيار أول لغة متاحة تلقائياً

    const firstAvailable = Array.from(targetSelect.options)
        .find(option => !option.disabled);

    if (firstAvailable) {
        targetSelect.value = firstAvailable.value;
    }

});


// =====================================
// عند اختيار لغة التعلم
// =====================================

targetSelect.addEventListener("change", function() {

    if (!currentNative) {
        return;
    }

    if (this.value === currentNative) {
        return;
    }

    document.getElementById("profileSection").classList.add("show");

});


// =====================================
// بدء التعلم وحفظ المعلومات
// =====================================

function startLearning() {

    const t = translations[currentNative];

    const name = document.getElementById("name").value.trim();

    const age = Number(document.getElementById("age").value);

    const profession = document.getElementById("profession").value.trim();

    const country = document.getElementById("country").value;

    const target = document.getElementById("target").value;

    if (!name) {
        alert(t.enterName);
        document.getElementById("name").focus();
        return;
    }

    if (!Number.isInteger(age) || age < 5 || age > 120) {
        alert(t.invalidAge);
        document.getElementById("age").focus();
        return;
    }

    if (!target || target === currentNative) {
        alert(t.sameLanguage);
        return;
    }

    const learner = {

        name: name,

        age: age,

        profession: profession,

        country: country,

        nativeLanguage: currentNative,

        targetLanguage: target

    };

    // الحفاظ على نفس مفتاح التخزين السابق

    localStorage.setItem(
        "lingoraLearner",
        JSON.stringify(learner)
    );

    // الانتقال إلى الصفحة التالية

    window.location.href = "dashboard.html";

}

</script>

</html>
