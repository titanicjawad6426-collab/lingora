<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINGORA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f4fc;
    color: #29234b;
}

header {
    background: linear-gradient(120deg,#39218a,#6652dc,#2996d8);
    color: white;
    padding: 25px 20px 50px;
    border-radius: 0 0 30px 30px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.profile {
    background: rgba(255,255,255,.2);
    padding: 12px;
    border-radius: 50%;
    font-size: 24px;
}

header h2 {
    margin-top: 40px;
    font-size: 25px;
}

header p {
    opacity: .95;
    line-height: 1.9;
    font-size: 15px;
}

.container {
    max-width: 750px;
    margin: 35px auto;
    padding: 20px;
}

.welcome-card {
    background: white;
    border-radius: 22px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.welcome-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.welcome-card h3 {
    color: #5136b5;
    font-size: 21px;
    margin-bottom: 12px;
}

.welcome-card p {
    color: #777;
    line-height: 1.9;
    font-size: 14px;
}

.start-learning {
    display: inline-block;
    background: linear-gradient(120deg,#5136b5,#2996d8);
    color: white;
    text-decoration: none;
    padding: 15px 35px;
    border-radius: 14px;
    font-weight: bold;
    font-size: 17px;
    margin-top: 20px;
    box-shadow: 0 5px 15px rgba(81,54,181,.2);
    transition: .2s;
}

.start-learning:active {
    transform: scale(.96);
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #999;
    font-size: 13px;
    line-height: 1.8;
}

@media(max-width:400px) {

    header h2 {
        font-size: 22px;
    }

    .welcome-card {
        padding: 25px 15px;
    }

}

</style>
</head>

<body>

<header>

    <div class="top">

        <div class="logo">LINGORA 🌍</div>

        <div class="profile">👤</div>

    </div>

    <h2 id="welcome"></h2>

    <p id="headerDescription"></p>

</header>


<main class="container">

    <div class="welcome-card">

        <div class="welcome-icon">🌟</div>

        <h3 id="cardTitle"></h3>

        <p id="cardDescription"></p>

        <a href="levels.html"
           class="start-learning"
           id="startButton">
        </a>

    </div>

</main>


<footer>

    LINGORA © 2026

    <br>

    Learn. Speak. Explore.

</footer>


<script>

// =====================================
// قراءة بيانات المتعلم
// =====================================

let learner = {};

try {

    learner = JSON.parse(
        localStorage.getItem("lingoraLearner") || "{}"
    );

} catch(error) {

    learner = {};

}


// =====================================
// التحقق من البيانات
// =====================================

if (!learner.name || !learner.nativeLanguage) {

    window.location.href = "language.html";

} else {


// =====================================
// ترجمات لوحة التحكم
// =====================================

const translations = {

    "العربية": {

        lang: "ar",
        dir: "rtl",
        title: "LINGORA - الصفحة الرئيسية",

        welcome: "مرحباً بك، {name}! 👋",

        header:
        "تعلم لغة جديدة، واكتشف عالماً من التواصل. ابدأ رحلتك وتعلم كيف تتحدث بثقة!",

        cardTitle:
        "رحلتك التعليمية تبدأ هنا",

        cardDescription:
        "اختر المستوى الذي يناسب معرفتك الحالية، وتعلم بالطريقة التي تناسبك. يمكنك تجاوز المراحل التي تعرفها مسبقاً والانتقال مباشرة إلى المحادثة.",

        start:
        "🚀 ابدأ التعلم"

    },


    "الفرنسية": {

        lang: "fr",
        dir: "ltr",
        title: "LINGORA - Accueil",

        welcome: "Bienvenue, {name} ! 👋",

        header:
        "Apprenez une nouvelle langue et découvrez un monde de communication. Commencez votre parcours et apprenez à parler avec confiance !",

        cardTitle:
        "Votre parcours d'apprentissage commence ici",

        cardDescription:
        "Choisissez le niveau qui correspond à vos connaissances. Apprenez à votre rythme. Vous pouvez passer les étapes que vous maîtrisez déjà et accéder directement à la conversation.",

        start:
        "🚀 Commencer à apprendre"

    },


    "الإنجليزية": {

        lang: "en",
        dir: "ltr",
        title: "LINGORA - Home",

        welcome: "Welcome, {name}! 👋",

        header:
        "Learn a new language and discover a world of communication. Start your journey and learn to speak with confidence!",

        cardTitle:
        "Your learning journey starts here",

        cardDescription:
        "Choose the level that matches your current knowledge and learn at your own pace. You can skip the stages you already know and go directly to conversation.",

        start:
        "🚀 Start Learning"

    },


    "الإسبانية": {

        lang: "es",
        dir: "ltr",
        title: "LINGORA - Inicio",

        welcome: "¡Bienvenido, {name}! 👋",

        header:
        "Aprende un nuevo idioma y descubre un mundo de comunicación. ¡Comienza tu viaje y aprende a hablar con confianza!",

        cardTitle:
        "Tu viaje de aprendizaje comienza aquí",

        cardDescription:
        "Elige el nivel que corresponde a tus conocimientos. Aprende a tu propio ritmo. Puedes saltarte las etapas que ya conoces e ir directamente a la conversación.",

        start:
        "🚀 Empezar a aprender"

    }

};


// =====================================
// تحديد لغة الواجهة
// =====================================

const nativeLanguage = learner.nativeLanguage;

const t = translations[nativeLanguage] || translations["العربية"];


// =====================================
// تطبيق اللغة على الصفحة
// =====================================

document.documentElement.lang = t.lang;

document.documentElement.dir = t.dir;

document.title = t.title;


// =====================================
// عرض المعلومات
// =====================================

document.getElementById("welcome").textContent =
    t.welcome.replace("{name}", learner.name);

document.getElementById("headerDescription").textContent =
    t.header;

document.getElementById("cardTitle").textContent =
    t.cardTitle;

document.getElementById("cardDescription").textContent =
    t.cardDescription;

document.getElementById("startButton").textContent =
    t.start;

}

</script>

</body>
</html>
